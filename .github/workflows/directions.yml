name: Website directions

# Client Command's "New website directions" button lands here. A teammate fills in the brief (client, domain,
# the one line a visitor must believe, ground, accent, cities, service lines) and Client Command dispatches this
# workflow with the build id. The job fetches the brief, scaffolds the client with newclient.py (sitemap, every
# page fetched and audited), has Claude Code write the content file the way /preview does (sourced facts only,
# the selection rules, the guardrails), renders the three directions with build.py, uploads the result into
# Client Command as a site, and commits the brand files back to main so the client is on the fifteen-minute
# path from then on. Nothing here touches HubSpot or Vercel.
#
# The authoring runs on the Claude subscription first (secret CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`).
# If that step cannot finish (the plan's usage limit, or any error), the same step runs again on the API key (secret
# ANTHROPIC_API_KEY) and the build log says so. Either secret alone is enough; with neither the build stops in the first
# minute and says which to add. Client Command is reached with the job's OIDC token, which it verifies was minted for this
# workflow in this repository; there is no shared key to leak or rotate.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Client Command build id (site_builds.id). Start builds from Client Command, Web Pages, not from here."
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: directions-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  directions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC_BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check there is a Claude credential
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ]; then echo "oauth=true" >> "$GITHUB_OUTPUT"; else echo "oauth=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$APIKEY" ]; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          if [ -z "$OAUTH" ] && [ -z "$APIKEY" ]; then
            echo "FAIL_REASON=The websitedesign repository has no Claude credential. Add CLAUDE_CODE_OAUTH_TOKEN (run claude setup-token) or ANTHROPIC_API_KEY under Settings, Secrets and variables, Actions." >> "$GITHUB_ENV"
            echo "::error::No Claude credential: add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as an Actions secret."
            exit 1
          fi

      - name: Fetch the brief
        id: brief
        run: python3 scripts/cc.py brief "$CC_BUILD_ID" >> "$GITHUB_OUTPUT"

      # A client whose content was tuned by hand (brands/<slug>.handtuned exists) keeps it: the two Claude steps below are
      # skipped, so the committed content.py is rendered as written and not rewritten from the brief.
      - name: Hand-tuned content?
        id: hold
        env:
          SLUG: ${{ steps.brief.outputs.slug }}
        run: |
          if [ -f "brands/$SLUG.handtuned" ]; then echo "handtuned=true" >> "$GITHUB_OUTPUT"; else echo "handtuned=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        run: |
          python3 scripts/cc.py progress "$CC_BUILD_ID" install "Setting up the build machine"
          pip install -q -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Playwright, for the hub screenshots
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Scaffold the client and read their site
        env:
          DOMAIN: ${{ steps.brief.outputs.domain }}
        run: |
          python3 scripts/cc.py progress "$CC_BUILD_ID" read "Reading $DOMAIN: the sitemap, every page, the audit"
          python3 scripts/cc.py scaffold "$CC_BUILD_ID"

      - name: Write the content and render the three directions (Claude subscription)
        id: sub
        if: steps.auth.outputs.oauth == 'true' && steps.hold.outputs.handtuned != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/directions ${{ steps.brief.outputs.slug }}"
          claude_args: "--max-turns 300 --allowedTools Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch,TodoWrite"

      - name: Say the build moved to the API key
        if: steps.sub.outcome == 'failure' && steps.auth.outputs.api == 'true'
        run: python3 scripts/cc.py progress "$CC_BUILD_ID" auth "The Claude subscription step did not finish (usage limit or an error); continuing on the API key" || true

      - name: Write the content and render the three directions (API key)
        id: api
        if: steps.sub.outcome != 'success' && steps.auth.outputs.api == 'true' && steps.hold.outputs.handtuned != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/directions ${{ steps.brief.outputs.slug }}"
          claude_args: "--max-turns 300 --allowedTools Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch,TodoWrite"

      # always(): a failed API-key step has already failed the job, and a step with no status function is skipped
      # after a failure, so the specific reason below would never reach Client Command. A step that was never reached
      # (an earlier step failed) reads 'skipped' on both, so this does not speak for a failure it did not see.
      - name: Stop if neither Claude step finished
        if: always() && steps.sub.outcome != 'success' && steps.api.outcome != 'success' && (steps.sub.outcome == 'failure' || steps.api.outcome == 'failure')
        run: |
          echo "FAIL_REASON=Claude did not finish writing the content (subscription: ${{ steps.sub.outcome }}, API key: ${{ steps.api.outcome }}). The run log has the step." >> "$GITHUB_ENV"
          exit 1

      - name: Render once more, deterministically
        env:
          SLUG: ${{ steps.brief.outputs.slug }}
        run: |
          python3 scripts/cc.py progress "$CC_BUILD_ID" render "Rendering the three directions and the hub"
          python3 scripts/build.py "$SLUG" --shots

      - name: Upload into Client Command
        env:
          SLUG: ${{ steps.brief.outputs.slug }}
        run: |
          python3 scripts/cc.py progress "$CC_BUILD_ID" upload "Copying the pages and assets into Client Command"
          ZIP=$(python3 scripts/cc.py upload "$CC_BUILD_ID" "$SLUG" "../out-$SLUG")
          python3 scripts/cc.py finish "$CC_BUILD_ID" "$SLUG" "../out-$SLUG" "$ZIP"

      - name: Keep the brand files on main
        env:
          SLUG: ${{ steps.brief.outputs.slug }}
          CLIENT: ${{ steps.brief.outputs.client }}
        run: |
          git config user.name "QBS conveyor"
          git config user.email "conveyor@thequantumleap.business"
          rm -f "brands/$SLUG.brief.json" "$SLUG.site.zip"
          git add "brands/$SLUG."*
          git commit -q -m "$CLIENT: three directions from the Client Command brief (build $CC_BUILD_ID)" || { echo "nothing to commit"; exit 0; }
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Tell Client Command it failed
        if: failure() || cancelled()
        run: python3 scripts/cc.py fail "$CC_BUILD_ID" "${FAIL_REASON:-The Website directions workflow stopped before the site was uploaded (${{ job.status }}). The run log has the step.}" || true
