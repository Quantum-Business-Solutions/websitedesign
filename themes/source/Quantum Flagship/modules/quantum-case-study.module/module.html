<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbfaf6'}[module.section_bg] }};{% endif %}">
  <div class="q-container" style="display:grid;grid-template-columns:0.9fr 1.1fr;gap:64px;align-items:center;">
    <div>
      <div class="q-eyebrow">{{ module.eyebrow }}</div>
      <div style="font-family:var(--q-serif);font-size:40px;line-height:1.1;color:var(--fg);margin:18px 0 0;">{{ module.heading }}</div>
      <p style="font-family:var(--q-serif);font-style:italic;font-size:22px;line-height:1.45;color:var(--fg);opacity:0.85;margin:24px 0 0;padding-left:22px;border-left:3px solid var(--q-gold);">{{ module.quote }}</p>
      <div style="font-size:14px;color:var(--fg-muted);margin-top:18px;">{{ module.attribution }}</div>
    </div>
    <div>
      {% if module.photo.src %}<div style="width:100%;height:300px;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px;"><img src="{{ module.photo.src }}" alt="{{ module.photo.alt }}" style="width:100%;height:100%;object-fit:cover;"></div>{% endif %}
      <div class="q-grid-2">
        {% for m in module.metrics %}
        <div class="q-card"><div style="font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--fg-muted);">{{ m.k }}</div><div style="font-family:var(--q-serif);font-size:34px;color:var(--accent-ink);margin-top:8px;">{{ m.v }}</div></div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
