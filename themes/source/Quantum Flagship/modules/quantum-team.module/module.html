<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div class="q-eyebrow">{{ module.eyebrow }}</div><div class="q-h2" style="margin:20px 0 48px;">{{ module.heading }}</div><div style="display:grid;grid-template-columns:repeat({{ module.members|length }},1fr);gap:24px;">{% for m in module.members %}<div><div style="width:100%;aspect-ratio:4/5;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--card);">{% if m.photo.src %}<img src="{{ m.photo.src }}" alt="{{ m.photo.alt }}" style="width:100%;height:100%;object-fit:cover;">{% endif %}</div><div style="font-size:17px;font-weight:600;color:var(--fg);margin-top:16px;">{{ m.person_name }}</div><div style="font-size:14px;color:var(--fg-muted);margin-top:2px;">{{ m.role }}</div></div>{% endfor %}</div></div></section>
