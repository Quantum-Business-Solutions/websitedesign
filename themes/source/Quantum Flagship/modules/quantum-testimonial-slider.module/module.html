<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" data-q-slider style="max-width:900px;text-align:center;">{% for t in module.items %}<figure class="q-slide" style="margin:0;">{% if t.avatar.src %}<img src="{{ t.avatar.src }}" alt="{{ t.avatar.alt }}" loading="lazy" style="width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 20px;display:block;">{% endif %}<blockquote style="font-family:var(--q-serif);font-style:italic;font-size:32px;line-height:1.35;color:var(--fg);margin:0;">{{ t.quote }}</blockquote><figcaption style="font-size:15px;color:var(--fg-muted);margin-top:24px;">{{ t.who }}{% if t.role %} &middot; {{ t.role }}{% endif %}</figcaption>{% if t.logo.src %}<img src="{{ t.logo.src }}" alt="{{ t.logo.alt }}" loading="lazy" style="height:26px;width:auto;margin:18px auto 0;display:block;opacity:0.75;">{% endif %}</figure>{% endfor %}<div data-q-dots style="display:flex;gap:0;justify-content:center;margin-top:32px;"></div></div></section>
