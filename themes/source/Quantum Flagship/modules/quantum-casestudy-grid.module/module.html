<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div class="q-h2" style="margin-bottom:40px;">{{ module.heading }}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;">{% for c in module.items %}<a href="{{ c.url.href }}" style="display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;"><div style="width:100%;height:200px;overflow:hidden;background:var(--bg-alt);">{% if c.img.src %}<img src="{{ c.img.src }}" alt="{{ c.img.alt }}" style="width:100%;height:100%;object-fit:cover;">{% endif %}</div><div style="padding:24px;"><div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--q-gold);">{{ c.tag }}</div><h3 style="font-family:var(--q-serif);font-size:22px;line-height:1.2;color:var(--fg);margin:10px 0 8px;">{{ c.title }}</h3><div style="font-size:14px;color:var(--fg-muted);">{{ c.metric }}</div></div></a>{% endfor %}</div></div></section>
