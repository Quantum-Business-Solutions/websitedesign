<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="text-align:center;{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbfaf6'}[module.section_bg] }};{% endif %}">
  <div class="q-container" style="max-width:820px;">
    <h2 class="q-h2" style="font-size:56px;">{{ module.heading }}</h2>
    <div class="q-lead" style="max-width:540px;margin:22px auto 0;">{{ module.subhead }}</div>
    <div style="margin-top:34px;"><a class="q-btn" href="{{ module.url.href }}">{{ module.cta_label }}</a></div>
  </div>
</section>
