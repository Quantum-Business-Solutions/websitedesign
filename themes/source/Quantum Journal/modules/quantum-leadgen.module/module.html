<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="background:#fbf8f1;color:#171b24;" data-theme="light"><div class="q-container" style="display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;"><div><div class="q-eyebrow">{{ module.eyebrow }}</div><h2 style="font-family:var(--q-serif);font-size:42px;line-height:1.1;color:#171b24;margin:16px 0 0;">{{ module.heading }}</h2><div style="font-size:17px;line-height:1.65;color:#6a6152;margin:16px 0 0;">{{ module.body_text }}</div></div><div class="q-form" style="background:#fff;border:1px solid rgba(154,125,63,0.22);border-radius:12px;padding:32px;">{% form "form" %}</div></div></section>
