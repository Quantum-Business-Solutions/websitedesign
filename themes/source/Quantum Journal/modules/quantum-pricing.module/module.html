<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><h2 class="q-h2" style="text-align:center;margin-bottom:48px;">{{ module.heading }}</h2><div style="display:grid;grid-template-columns:repeat({{ module.plans|length }},1fr);gap:20px;align-items:stretch;">{% for p in module.plans %}<div style="background:var(--card);border:1px solid {% if p.featured %}var(--q-gold){% else %}var(--border){% endif %};border-radius:12px;padding:32px;display:flex;flex-direction:column;">{% if p.featured %}<div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--q-gold);margin-bottom:12px;">Most popular</div>{% endif %}<h3 style="font-size:20px;font-weight:600;color:var(--fg);margin:0;">{{ p.plan_name }}</h3><div style="font-family:var(--q-serif);font-size:40px;color:var(--fg);margin:14px 0 2px;">{{ p.price }}</div><div style="font-size:13px;color:var(--fg-muted);">{{ p.unit }}</div><p style="font-size:15px;line-height:1.6;color:var(--fg-muted);margin:18px 0 24px;flex:1;">{{ p.desc }}</p><a class="{% if p.featured %}q-btn{% else %}q-btn-ghost{% endif %}" href="{{ module.url.href }}">{{ p.cta }}</a></div>{% endfor %}</div></div></section>
