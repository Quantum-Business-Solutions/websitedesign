<section style="padding:40px 0;{% if module.section_bg == 'void' %}background:#080b12;{% elif module.section_bg == 'navy' %}background:#101725;{% elif module.section_bg == 'paper' %}background:#fbf8f1;{% endif %}"><div class="q-container"><div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px 40px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;"><div style="font-family:var(--q-serif);font-size:26px;color:var(--fg);">{{ module.text }}</div><a class="q-btn" href="{{ module.url.href }}">{{ module.cta_label }}</a></div></div></section>
