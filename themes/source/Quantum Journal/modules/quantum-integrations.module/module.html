<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="text-align:center;"><div class="q-eyebrow" style="justify-content:center;">{{ module.eyebrow }}</div><h2 class="q-h2" style="margin:20px auto 40px;max-width:680px;">{{ module.heading }}</h2><div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">{% for t in module.tools %}<div style="display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:12px 22px;">{% if t.logo.src %}<img src="{{ t.logo.src }}" alt="{{ t.tool_name }}" style="height:20px;width:auto;">{% endif %}<span style="font-size:15px;font-weight:600;color:var(--fg);">{{ t.tool_name }}</span></div>{% endfor %}</div></div></section>
