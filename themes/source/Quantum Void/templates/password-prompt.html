<!--
  templateType: password_prompt_page
  label: Quantum Password Prompt
-->
{% extends "./layouts/base.html" %}
{% block body %}
<section class="q-section" style="padding:160px 0;">
  <div class="q-container" style="max-width:460px;text-align:center;">
    <div style="font-family:var(--q-serif);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--q-gold);margin-bottom:14px;">Protected</div>
    <h1 class="q-h2" style="margin:0 0 12px;">This page is password protected</h1>
    <p class="q-lead" style="margin:0 0 30px;color:var(--fg-muted);">Enter the password to continue.</p>
    <form class="q-form" method="post" action="" style="display:flex;flex-direction:column;gap:14px;text-align:left;">
      <label for="q-pwd">Password</label>
      <input id="q-pwd" type="password" name="password" autocomplete="current-password" required />
      <button class="q-btn" type="submit" style="margin-top:6px;">Unlock page</button>
    </form>
  </div>
</section>
{% endblock %}
