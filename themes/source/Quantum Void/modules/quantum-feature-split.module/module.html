<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;">{% if module.flip %}<div style="width:100%;height:400px;border-radius:16px;overflow:hidden;border:1px solid var(--border);order:0;">{% if module.image.src %}<img src="{{ module.image.src }}" alt="{{ module.image.alt }}" style="width:100%;height:100%;object-fit:cover;">{% endif %}</div>{% endif %}<div><div class="q-eyebrow">{{ module.eyebrow }}</div><h2 class="q-h2" style="font-size:40px;margin:18px 0 0;">{{ module.heading }}</h2><div style="font-size:17px;line-height:1.7;color:var(--fg-muted);margin:18px 0 0;">{{ module.body_text }}</div>{% if module.cta_label %}<a class="q-btn-ghost" style="margin-top:24px;" href="{{ module.cta_url.href }}">{{ module.cta_label }}<span style="width:20px;height:1px;background:currentColor;display:inline-block;"></span></a>{% endif %}</div>{% unless module.flip %}<div style="width:100%;height:400px;border-radius:16px;overflow:hidden;border:1px solid var(--border);">{% if module.image.src %}<img src="{{ module.image.src }}" alt="{{ module.image.alt }}" style="width:100%;height:100%;object-fit:cover;">{% endif %}</div>{% endunless %}</div></section>
