<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:720px;"><div style="display:flex;gap:8px;justify-content:center;margin-bottom:28px;"><span style="width:36px;height:4px;border-radius:2px;background:var(--q-gold);"></span><span style="width:36px;height:4px;border-radius:2px;background:var(--border);"></span><span style="width:36px;height:4px;border-radius:2px;background:var(--border);"></span></div><div class="q-h2" style="text-align:center;margin-bottom:28px;">{{ module.heading }}</div><div class="q-form" style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;">{% if module.form.form_id %}{% form "quantum_multistep_form_form" form_to_use="{{ module.form.form_id }}" response_response_type="{{ module.form.response_type|default('inline') }}" response_message="{{ module.form.message }}" %}{% endif %}</div></div></section>
