<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div class="q-h2" style="text-align:center;margin-bottom:40px;">{{ module.heading }}</div><div style="display:grid;grid-template-columns:repeat({{ module.items|length }},1fr);gap:20px;">{% for r in module.items %}<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;text-align:center;"><div style="color:var(--q-gold);font-size:18px;letter-spacing:2px;">&#9733;&#9733;&#9733;&#9733;&#9733;</div><div style="font-family:var(--q-serif);font-size:40px;color:var(--fg);margin-top:10px;">{{ r.score }}</div><div style="font-size:14px;color:var(--fg-muted);margin-top:6px;">{{ r.platform }} {{ r.count }}</div></div>{% endfor %}</div></div></section>
