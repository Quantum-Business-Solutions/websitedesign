<style>.q-form .hs-form input[type=text],.q-form .hs-form input[type=email],.q-form .hs-form input[type=tel],.q-form .hs-form textarea,.q-form .hs-form select{background:#fbf8f1!important;color:#171b24!important;border:1px solid rgba(154,125,63,.35)!important}.q-form .hs-form label,.q-form .hs-form .hs-form-booleancheckbox-display,.q-form .hs-form legend{color:#6a6152!important}.q-form .hs-error-msgs label{color:#a33!important}</style><section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="background:#fbf8f1;color:#171b24;" data-theme="light"><div class="q-container" style="display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;"><div><div class="q-eyebrow">{{ module.eyebrow }}</div><h2 style="font-family:var(--q-serif);font-size:42px;line-height:1.1;color:#171b24;margin:16px 0 0;">{{ module.heading }}</h2><div style="font-size:17px;line-height:1.65;color:#6a6152;margin:16px 0 0;">{{ module.body_text }}</div></div><div class="q-form" style="background:#fff;border:1px solid rgba(154,125,63,0.22);border-radius:12px;padding:32px;">{% if module.form.form_id %}{% form "quantum_leadgen_form" form_to_use="{{ module.form.form_id }}" response_response_type="{{ module.form.response_type|default('inline') }}" response_message="{{ module.form.message }}" %}{% endif %}</div></div></section>
