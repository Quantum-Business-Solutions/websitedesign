<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div style="display:grid;grid-template-columns:repeat({{ module.per_row }},1fr);gap:24px;">{% for c in module.cols %}<div class="q-col{% if module.boxed %} q-col-boxed{% endif %}" style="{% if module.boxed %}background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;{% endif %}">{% if c.image.src %}<div style="width:100%;height:180px;border-radius:8px;overflow:hidden;margin-bottom:18px;"><img src="{{ c.image.src }}" alt="{{ c.image.alt }}" style="width:100%;height:100%;object-fit:cover;"></div>{% endif %}<div class="q-col-body">{{ c.col_body }}</div></div>{% endfor %}</div></div></section>
