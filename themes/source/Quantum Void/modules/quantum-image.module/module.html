<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><figure style="max-width:{{ module.width }}px;margin:0 auto;"><div style="width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--border);">{% if module.image.src %}<img src="{{ module.image.src }}" alt="{{ module.image.alt }}" style="width:100%;height:auto;display:block;">{% endif %}</div>{% if module.caption %}<figcaption style="font-size:13px;color:var(--fg-muted);text-align:center;margin-top:12px;">{{ module.caption }}</figcaption>{% endif %}</figure></div></section>
