<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:820px;"><div class="q-h2" style="text-align:center;margin-bottom:36px;">{{ module.heading }}</div><div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:end;">
<label style="font-size:13px;color:var(--fg-muted);">{{ module.rep_label }}<input id="q-reps" type="number" value="5" style="width:100%;margin-top:8px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-size:16px;box-sizing:border-box;"></label>
<label style="font-size:13px;color:var(--fg-muted);">{{ module.deal_label }}<input id="q-deal" type="number" value="12000" style="width:100%;margin-top:8px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--fg);font-size:16px;box-sizing:border-box;"></label>
<div style="grid-column:1 / -1;border-top:1px solid var(--border);padding-top:24px;text-align:center;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:0.12em;color:var(--fg-muted);">Estimated annual upside</div><div id="q-out" style="font-family:var(--q-serif);font-size:64px;color:var(--q-gold);line-height:1;margin-top:8px;">$0</div></div></div></div>
<script>(function(){var lift={{ module.lift }}/100;function f(){var r=+document.getElementById('q-reps').value||0,d=+document.getElementById('q-deal').value||0;var v=Math.round(r*d*12*lift);document.getElementById('q-out').textContent='$'+v.toLocaleString();}['q-reps','q-deal'].forEach(function(id){document.getElementById(id).addEventListener('input',f)});f();})();</script></section>
