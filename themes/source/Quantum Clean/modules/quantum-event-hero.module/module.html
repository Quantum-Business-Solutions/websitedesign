<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div style="display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;"><div><div class="q-eyebrow"><span class="q-eyebrow-rule"></span>{{ module.kind }}</div><div class="q-h1" style="margin:20px 0 24px;">{{ module.title }}</div><div style="font-size:18px;line-height:1.7;color:var(--fg-muted);margin:0 0 32px;max-width:520px;">{{ module.summary }}</div><div style="display:flex;flex-wrap:wrap;gap:28px;margin-bottom:32px;">{% for d in module.details %}<div><div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px;">{{ d.detail_label }}</div><div style="font-size:16px;font-weight:600;color:var(--fg);">{{ d.value }}</div></div>{% endfor %}</div>{% if module.url.href %}<a class="q-btn" href="{{ module.url.href }}">{{ module.cta }}</a>{% endif %}{% if module.cta_note %}<div style="font-size:13px;color:var(--fg-muted);margin-top:12px;">{{ module.cta_note }}</div>{% endif %}</div><div>{% if module.image.src %}<img src="{{ module.image.src }}" alt="{{ module.image.alt }}" loading="lazy" style="width:100%;border:1px solid var(--border);border-radius:12px;">{% else %}<div style="aspect-ratio:4/3;border:1px solid var(--border);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;"><span style="font-family:var(--q-serif);font-size:64px;color:var(--accent-ink);opacity:0.4;">Q</span></div>{% endif %}</div></div></div></section>
