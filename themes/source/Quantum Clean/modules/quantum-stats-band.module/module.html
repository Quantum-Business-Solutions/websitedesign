<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbfaf6'}[module.section_bg] }};{% endif %}">
  <div class="q-container" style="display:grid;grid-template-columns:repeat({{ module.stats|length }},1fr);gap:0;">
    {% for s in module.stats %}
    <div style="padding:0 32px;text-align:center;{% if not loop.last %}border-right:1px solid var(--border);{% endif %}">
      <div style="font-family:var(--q-serif);font-size:64px;line-height:1;color:var(--accent-ink);">{% if s.num %}<span data-count="{{ s.num }}" data-prefix="{{ s.prefix }}" data-suffix="{{ s.suffix }}">{{ s.prefix }}{{ s.num }}{{ s.suffix }}</span>{% else %}{{ s.v }}{% endif %}</div>
      <div style="font-size:14px;color:var(--fg-muted);margin-top:12px;">{{ s.k }}</div>
    </div>
    {% endfor %}
  </div>
  {% if module.note %}<div class="q-container" style="margin-top:24px;"><p style="font-size:12px;color:var(--fg-muted);text-align:center;">{{ module.note }}</p></div>{% endif %}
</section>
