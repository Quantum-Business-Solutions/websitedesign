<header class="q-section" style="padding:96px 0 40px;"><div class="q-container" style="max-width:820px;"><div class="q-eyebrow">{{ blog_post.blog.title|default('Insights') }}</div><h1 style="font-family:var(--q-serif);font-size:56px;line-height:1.05;color:var(--fg);margin:22px 0 0;">{{ content.name }}</h1>{% if module.show_meta %}<div style="font-size:14px;color:var(--fg-muted);margin-top:20px;">{{ content.publish_date_localized }} · {{ content.blog_post_author.display_name }}</div>{% endif %}</div></header>
