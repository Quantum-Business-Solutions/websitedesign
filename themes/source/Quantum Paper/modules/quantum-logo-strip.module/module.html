<section style="padding:8px 0 90px;"><div class="q-container" style="padding-top:36px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:48px;flex-wrap:wrap;opacity:0.7;"><span style="font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);">{{ module.caption }}</span>{% for l in module.logos %}{% if l.dark.src or l.light.src %}{% if l.dark.src %}<img class="only-dark" src="{{ l.dark.src }}" alt="{{ l.dark.alt }}" style="height:{{ l.h }}px;width:auto;">{% endif %}{% if l.light.src %}<img class="only-light" src="{{ l.light.src }}" alt="{{ l.light.alt }}" style="height:{{ l.h }}px;width:auto;">{% endif %}{% else %}<span style="font-family:var(--q-serif);font-size:22px;color:var(--fg);">{{ l.logo_label }}</span>{% endif %}{% endfor %}</div></section>
