<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div class="q-h2" style="text-align:center;">{{ module.heading }}</div><div class="q-price" data-price style="display:flex;justify-content:center;gap:10px;align-items:center;margin:24px 0 44px;"><span style="font-size:14px;color:var(--fg);">Monthly</span><button data-toggle aria-label="Toggle billing" style="width:52px;height:28px;border-radius:999px;border:1px solid var(--border);background:var(--card);position:relative;cursor:pointer;"><span data-knob style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--q-gold);transition:left 200ms ease;"></span></button><span style="font-size:14px;color:var(--fg);">Annual <span style="color:var(--accent-ink);">&minus;15%</span></span></div><div style="display:grid;grid-template-columns:repeat({{ module.plans|length }},1fr);gap:20px;">{% for p in module.plans %}<div style="background:var(--card);border:1px solid {% if p.featured %}var(--q-gold){% else %}var(--border){% endif %};border-radius:12px;padding:32px;">{% if p.featured %}<div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px;">Most popular</div>{% endif %}<h3 style="font-size:20px;font-weight:600;color:var(--fg);margin:0;">{{ p.plan_name }}</h3><div style="margin:14px 0 2px;"><span class="q-m" style="font-family:var(--q-serif);font-size:40px;color:var(--fg);">{{ p.m }}</span><span class="q-a" style="font-family:var(--q-serif);font-size:40px;color:var(--fg);display:none;">{{ p.a }}</span><span style="font-size:14px;color:var(--fg-muted);">{{ p.unit }}</span></div></div>{% endfor %}</div></div>
<script>(function(){var r=document.currentScript.closest('section');if(!r)return;var t=r.querySelector('[data-toggle]'),k=r.querySelector('[data-knob]'),on=false;t.addEventListener('click',function(){on=!on;k.style.left=on?'29px':'3px';r.querySelectorAll('.q-m').forEach(function(e){e.style.display=on?'none':'inline'});r.querySelectorAll('.q-a').forEach(function(e){e.style.display=on?'inline':'none'});});})();</script></section>
