<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div class="q-eyebrow">{{ module.eyebrow }}</div><h2 class="q-h2" style="margin:20px 0 48px;max-width:640px;">{{ module.heading }}</h2><div style="display:flex;flex-direction:column;">{% for s in module.steps %}<div style="display:grid;grid-template-columns:80px 200px 1fr;gap:32px;align-items:baseline;padding:28px 0;border-top:1px solid var(--border);{% if loop.last %}border-bottom:1px solid var(--border);{% endif %}"><div style="font-family:var(--q-serif);font-size:30px;color:var(--q-gold);">{{ s.num }}</div><h3 style="font-size:20px;font-weight:600;color:var(--fg);margin:0;">{{ s.title }}</h3><p style="font-size:15px;line-height:1.7;color:var(--fg-muted);margin:0;max-width:560px;">{{ s.step_body }}</p></div>{% endfor %}</div></div></section>
