{% require_css %}<style>
.qrot-{{ module.id }}{padding:96px 0;{% if module.section_bg=='alt' %}background:var(--bg-alt);{% endif %}}
.qrot-{{ module.id }} .qrot-word{display:inline-block;font-family:var(--q-serif);font-style:italic;color:var(--q-gold);transition:opacity .35s ease;}
</style>{% end_require_css %}
<section class="qrot-{{ module.id }}"><div class="q-container" style="text-align:{{ module.align|default('center') }};">
  {% if module.eyebrow %}<div class="q-eyebrow">{{ module.eyebrow }}</div>{% endif %}
  <h2 class="q-h2" style="margin-top:18px;">{{ module.pre_text }} <em class="qrot-word">{{ module.words|split(',')|first|trim }}</em> {{ module.post_text }}</h2>
</div></section>
<script>
(function(){
  var w="{{ module.words }}".split(",").map(function(x){return x.trim();}).filter(Boolean);
  var el=document.querySelector(".qrot-{{ module.id }} .qrot-word");
  if(!el||w.length<2)return;var i=0;
  setInterval(function(){el.style.opacity="0";setTimeout(function(){i=(i+1)%w.length;el.textContent=w[i];el.style.opacity="1";},350);},2400);
})();
</script>
