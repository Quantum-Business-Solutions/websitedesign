<section class="q-section"><div class="q-container"><div class="q-h2" style="margin-bottom:40px;">{{ module.heading }}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;">{% for post in contents %}<a href="{{ post.absolute_url }}" style="display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;">{% if post.featured_image %}<div style="width:100%;height:180px;overflow:hidden;"><img src="{{ post.featured_image }}" alt="{{ post.featured_image_alt_text }}" style="width:100%;height:100%;object-fit:cover;"></div>{% endif %}<div style="padding:24px;"><div style="font-size:12px;color:var(--q-gold);text-transform:uppercase;letter-spacing:0.1em;">{{ post.publish_date_localized }}</div><h3 style="font-family:var(--q-serif);font-size:22px;line-height:1.2;color:var(--fg);margin:10px 0 0;">{{ post.name }}</h3></div></a>{% endfor %}</div></div></section>
