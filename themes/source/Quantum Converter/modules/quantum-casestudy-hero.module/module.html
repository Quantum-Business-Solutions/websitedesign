<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--q-gold);">{{ module.client }} &middot; {{ module.industry }}</div><div class="q-h1" style="font-size:56px;margin:18px 0 0;max-width:820px;">{{ module.heading }}</div><div style="width:100%;height:360px;border-radius:16px;overflow:hidden;border:1px solid var(--border);margin:36px 0;background:var(--card);">{% if module.image.src %}<img src="{{ module.image.src }}" alt="{{ module.image.alt }}" style="width:100%;height:100%;object-fit:cover;">{% endif %}</div><div style="display:grid;grid-template-columns:repeat({{ module.stats|length }},1fr);gap:0;">{% for s in module.stats %}<div style="padding:0 32px;text-align:center;{% if not loop.last %}border-right:1px solid var(--border);{% endif %}"><div style="font-family:var(--q-serif);font-size:56px;color:var(--q-gold);line-height:1;">{{ s.v }}</div><div style="font-size:14px;color:var(--fg-muted);margin-top:10px;">{{ s.k }}</div></div>{% endfor %}</div></div></section>
