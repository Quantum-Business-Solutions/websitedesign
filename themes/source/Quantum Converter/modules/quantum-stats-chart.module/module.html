<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="display:grid;grid-template-columns:0.9fr 1.1fr;gap:64px;align-items:center;"><div><div class="q-eyebrow">{{ module.eyebrow }}</div><div class="q-h2" style="font-size:38px;margin:18px 0 24px;">{{ module.heading }}</div><div style="font-family:var(--q-serif);font-size:80px;line-height:1;color:var(--accent-ink);">{{ module.takeaway }}</div><div style="font-size:15px;color:var(--fg-muted);margin-top:8px;max-width:280px;">{{ module.takeaway_label }}</div></div><div style="display:flex;align-items:flex-end;gap:14px;height:280px;border-bottom:1px solid var(--border);padding-bottom:0;">{% set maxv = module.bars|map(attribute='data_value')|max %}{% if not maxv %}{% set maxv = 1 %}{% endif %}{% for b in module.bars %}<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;"><div class="q-chart-bar" style="width:100%;height:{{ (b.data_value / maxv * 100)|round }}%;background:{% if loop.last %}var(--q-gold){% else %}rgba(196,164,74,0.3){% endif %};border-radius:4px 4px 0 0;"></div><div style="font-size:12px;color:var(--fg-muted);margin-top:10px;">{{ b.data_label }}</div></div>{% endfor %}</div></div></section>
