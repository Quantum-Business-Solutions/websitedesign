<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:900px;"><div class="q-h2" style="text-align:center;margin-bottom:40px;">{{ module.heading }}</div><div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;"><div style="padding:18px 24px;"></div><div style="padding:18px 24px;font-weight:600;color:var(--accent-ink);border-left:1px solid var(--border);">{{ module.col_a }}</div><div style="padding:18px 24px;font-weight:600;color:var(--fg-muted);border-left:1px solid var(--border);">{{ module.col_b }}</div>{% for r in module.rows %}<div style="padding:18px 24px;border-top:1px solid var(--border);color:var(--fg);font-size:15px;">{{ r.row_label }}</div><div style="padding:18px 24px;border-top:1px solid var(--border);border-left:1px solid var(--border);color:var(--fg);font-size:15px;">{{ r.a }}</div><div style="padding:18px 24px;border-top:1px solid var(--border);border-left:1px solid var(--border);color:var(--fg-muted);font-size:15px;">{{ r.b }}</div>{% endfor %}</div></div></section>
