<div id="q-sticky" style="position:fixed;left:0;right:0;bottom:0;z-index:80;transform:translateY(120%);transition:transform 260ms ease;background:var(--bg-alt);border-top:1px solid var(--border);padding:16px 40px;"><div style="max-width:{{ {'full':'1240px','half':'620px','left':'760px','right':'760px'}[module.content_width|default('full')] }};margin:{{ {'full':'0 auto','half':'0 auto','left':'0','right':'0 0 0 auto'}[module.content_width|default('full')] }};display:flex;align-items:center;justify-content:space-between;gap:24px;"><span style="font-family:var(--q-serif);font-size:20px;color:var(--fg);">{{ module.text }}</span><a class="q-btn" href="{{ module.url.href }}">{{ module.cta_label }}</a></div></div>
<script>(function(){var b=document.getElementById('q-sticky');if(!b)return;function s(){b.style.transform=window.scrollY>700?'translateY(0)':'translateY(120%)';}window.addEventListener('scroll',s,{passive:true});s();})();</script>
