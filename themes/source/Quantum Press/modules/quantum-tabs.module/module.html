<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:960px;"><div class="q-h2" style="text-align:center;margin-bottom:40px;">{{ module.heading }}</div><div data-q-tabs><div role="tablist" aria-label="{{ module.heading|striptags }}" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:16px;">{% for t in module.tabs %}<button role="tab" id="qtab-{{ loop.index0 }}" aria-controls="qpanel-{{ loop.index0 }}" aria-selected="false" style="font-family:var(--q-sans);font-size:14px;font-weight:600;padding:10px 20px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--fg);cursor:pointer;">{{ t.tab_label }}</button>{% endfor %}</div>{% for t in module.tabs %}<div role="tabpanel" id="qpanel-{{ loop.index0 }}" aria-labelledby="qtab-{{ loop.index0 }}" hidden style="padding:32px 0;"><p style="font-size:18px;line-height:1.7;color:var(--fg-muted);margin:0;">{{ t.tab_body }}</p></div>{% endfor %}</div></div></section>
