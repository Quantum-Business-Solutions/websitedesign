<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:960px;"><div class="q-eyebrow">{{ module.eyebrow }}</div><h2 class="q-h2" style="margin:20px 0 32px;">{{ module.heading }}</h2><nav data-q-spy aria-label="On this page" style="display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px;border-top:1px solid var(--border);">{% for i in module.items %}<a href="#{{ i.anchor }}" style="display:flex;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--fg);font-size:16px;font-weight:500;"><span style="font-family:var(--q-serif);color:var(--accent-ink);font-size:18px;">{{ "%02d"|format(loop.index) }}</span><span>{{ i.item_label }}</span></a>{% endfor %}</nav></div></section>
