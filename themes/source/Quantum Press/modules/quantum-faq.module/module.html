<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:860px;"><div class="q-h2" style="text-align:center;margin-bottom:40px;">{{ module.heading }}</div>{% for it in module.items %}<details class="q-faq" {% if loop.first %}open{% endif %} style="border-top:1px solid var(--border);{% if loop.last %}border-bottom:1px solid var(--border);{% endif %}padding:22px 0;"><summary style="list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:var(--q-serif);font-size:20px;color:var(--fg);">{{ it.q }}<span style="color:var(--q-gold);font-size:24px;">+</span></summary><p style="font-size:15px;line-height:1.7;color:var(--fg-muted);margin:14px 0 0;">{{ it.a }}</p></details>{% endfor %}</div>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for it in module.items %}{"@type":"Question","name":"{{ it.q|escapejson }}","acceptedAnswer":{"@type":"Answer","text":"{{ it.a|escapejson }}"}}{% if not loop.last %},{% endif %}{% endfor %}]}</script>
</section>
