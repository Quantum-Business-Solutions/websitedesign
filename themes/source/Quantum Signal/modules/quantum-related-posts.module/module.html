<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div class="q-h2" style="margin-bottom:32px;">{{ module.heading }}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;">{% for post in blog_recent_posts('default', module.count) %}<a href="{{ post.absolute_url }}" style="display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;">{% if post.featured_image %}<div style="height:170px;overflow:hidden;"><img src="{{ post.featured_image }}" alt="{{ post.name }}" style="width:100%;height:100%;object-fit:cover;"></div>{% endif %}<div style="padding:22px;"><div style="font-size:12px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:0.1em;">{{ post.publish_date_localized }}</div><h3 style="font-family:var(--q-serif);font-size:20px;line-height:1.2;color:var(--fg);margin:10px 0 0;">{{ post.name }}</h3></div></a>{% endfor %}</div></div></section>
