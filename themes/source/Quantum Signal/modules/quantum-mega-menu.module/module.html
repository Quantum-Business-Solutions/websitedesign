<div style="border:1px solid var(--border);border-radius:12px;background:var(--bg-alt);padding:32px;display:grid;grid-template-columns:repeat({{ module.columns|length }},1fr);gap:32px;">{% for c in module.columns %}<div><div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:14px;">{{ c.title }}</div>{% for l in c.links|split('|') %}<a href="#" style="display:block;font-size:15px;color:var(--fg);padding:6px 0;">{{ l }}</a>{% endfor %}</div>{% endfor %}</div>
