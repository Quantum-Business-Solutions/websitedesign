<section id="{{ module.anchor }}" class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:760px;"><div style="display:flex;align-items:baseline;gap:20px;"><span style="font-family:var(--q-serif);font-size:40px;color:var(--accent-ink);line-height:1;">{{ module.num }}</span><div class="q-h2" style="margin:0;">{{ module.title }}</div></div><div class="q-prose" style="margin-top:24px;">{{ module.body_text }}</div></div></section>
