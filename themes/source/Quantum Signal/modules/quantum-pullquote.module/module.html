<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:900px;"><p style="font-family:var(--q-serif);font-style:italic;font-size:34px;line-height:1.35;color:var(--fg);margin:0;padding-left:32px;border-left:3px solid var(--q-gold);">{{ module.quote }}</p><div style="font-size:15px;color:var(--fg-muted);margin-top:24px;padding-left:32px;">{{ module.attribution }}</div></div></section>
