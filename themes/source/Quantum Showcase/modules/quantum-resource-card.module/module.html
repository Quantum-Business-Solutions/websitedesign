<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container"><div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px;display:grid;grid-template-columns:1fr 0.8fr;gap:48px;align-items:center;"><div><div class="q-eyebrow">{{ module.eyebrow }}</div><h2 class="q-h2" style="font-size:38px;margin:18px 0 0;">{{ module.heading }}</h2><div class="q-lead" style="font-size:17px;margin:18px 0 28px;">{{ module.body_text }}</div><a class="q-btn" href="{{ module.url.href }}">{{ module.card_label }}</a></div><div style="width:100%;height:280px;border-radius:12px;overflow:hidden;border:1px solid var(--border);">{% if module.image.src %}<img src="{{ module.image.src }}" alt="{{ module.image.alt }}" style="width:100%;height:100%;object-fit:cover;">{% endif %}</div></div></div></section>
