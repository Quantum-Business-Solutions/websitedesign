<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="display:grid;grid-template-columns:repeat({{ module.cards|length }},1fr);gap:20px;">{% for c in module.cards %}<div class="q-card"><div style="font-family:var(--q-serif);font-size:56px;line-height:1;color:var(--q-gold);">{% if c.num %}<span data-count="{{ c.num }}" data-prefix="{{ c.prefix }}" data-suffix="{{ c.suffix }}">{{ c.prefix }}0{{ c.suffix }}</span>{% else %}{{ c.v }}{% endif %}</div><div style="font-size:16px;font-weight:600;color:var(--fg);margin-top:12px;">{{ c.k }}</div><div style="font-size:14px;line-height:1.6;color:var(--fg-muted);margin-top:6px;">{{ c.d }}</div></div>{% endfor %}</div></section>
