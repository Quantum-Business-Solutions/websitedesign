<section class="q-section q-w-{{ module.content_width|default('full') }} q-pad-{{ module.padding|default('normal') }}" style="{% if module.section_bg != 'default' %}background:{{ {'void':'#080b12','navy':'#101725','paper':'#fbf8f1'}[module.section_bg] }};{% endif %}"><div class="q-container" style="max-width:960px;text-align:center;"><div class="q-eyebrow" style="justify-content:center;">{{ module.eyebrow }}</div><div class="q-h2" style="margin:20px 0 32px;">{{ module.heading }}</div><div style="width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--card);">{% if module.embed %}{{ module.embed }}{% elif module.poster.src %}<img src="{{ module.poster.src }}" alt="{{ module.poster.alt }}" style="width:100%;height:100%;object-fit:cover;">{% endif %}</div></div></section>
